<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>推理 · THE ART OF REASONING</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Noto+Serif+SC:wght@400;700;900&family=Ma+Shan+Zheng&display=block" rel="stylesheet">
<style>
:root{
  --serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --latin:"Cinzel","Trajan Pro","Times New Roman",serif;
  --brush:"Ma Shan Zheng","STXingkai","KaiTi","STKaiti",serif;
  --gold:#e8c27a; --gold2:#b8862f; --ink:#e9e3d6;
  --bar:max(9vh,calc((100vh - 41.84vw) / 2));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;color:var(--ink);font-family:var(--serif);-webkit-font-smoothing:antialiased}
#film{position:fixed;inset:0;overflow:hidden;background:#000;cursor:default}
#film.hidecursor{cursor:none}
#cam{position:absolute;inset:0;overflow:hidden}
#stage{position:absolute;inset:0;overflow:hidden}
#grade{position:absolute;inset:0;pointer-events:none;z-index:6;mix-blend-mode:soft-light;background:linear-gradient(160deg,rgba(0,130,150,.38),transparent 45%,transparent 55%,rgba(255,140,40,.32))}
.flare{position:absolute;left:-10%;right:-10%;height:.6vh;margin-top:-.3vh;z-index:21;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(var(--fc),.12) 15%,rgba(var(--fc),.85) 47%,#fff 50%,rgba(var(--fc),.85) 53%,rgba(var(--fc),.12) 85%,transparent);box-shadow:0 0 3vh 1vh rgba(var(--fc),.3);mix-blend-mode:screen}
.flare::after{content:"";position:absolute;left:50%;top:50%;width:22vmin;height:22vmin;margin:-11vmin 0 0 -11vmin;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.9),rgba(var(--fc),.35) 25%,transparent 65%)}
.shock{position:absolute;left:50%;top:50%;width:150vmax;height:150vmax;border-radius:50%;border:1px solid rgba(255,230,190,.85);box-shadow:0 0 4vmin rgba(255,220,170,.5),inset 0 0 4vmin rgba(255,220,170,.4);z-index:19;pointer-events:none}
.rays{mix-blend-mode:screen;pointer-events:none}
.rays>div{position:absolute;left:-60%;top:-90%;width:220%;height:220%;transform-origin:35% 0%;filter:blur(10px);
  background:repeating-conic-gradient(from 150deg at 35% 0%,rgba(255,225,170,0) 0deg,rgba(255,225,170,.13) 1.6deg,rgba(255,225,170,0) 4deg,rgba(255,225,170,0) 7.5deg)}
.ca{animation:ca 1s ease-out both}
@keyframes ca{0%{filter:drop-shadow(-1.4vmin 0 rgba(255,30,80,.8)) drop-shadow(1.4vmin 0 rgba(0,210,255,.8))}100%{filter:drop-shadow(0 0 0 rgba(255,30,80,0)) drop-shadow(0 0 0 rgba(0,210,255,0))}}
.cbig{position:absolute;top:50%;margin-top:-22vmin;font-family:var(--latin);font-size:36vmin;line-height:44vmin;font-weight:900;color:transparent;-webkit-text-stroke:1px rgba(232,194,122,.22);z-index:1;pointer-events:none;white-space:nowrap}
.cbig.left{left:2vw}.cbig.right{right:2vw}.cbig.center{left:0;right:0;text-align:center}
.bang{position:absolute;left:50%;top:50%;width:100vmin;height:100vmin;border-radius:50%;z-index:4;background:radial-gradient(circle,#fff 0%,rgba(255,244,220,.95) 6%,rgba(255,200,140,.35) 18%,rgba(120,160,255,.08) 40%,transparent 65%)}
.planet{position:absolute;left:50%;top:72vh;width:300vw;height:300vw;margin-left:-150vw;border-radius:50%;background:radial-gradient(circle at 50% 0%,#2a5a9a 0%,#0c2347 3%,#030915 12%,#000 30%);box-shadow:0 -.6vh 3vh rgba(140,200,255,.8),0 -2vh 10vh rgba(80,150,255,.45)}
.sunrise{position:absolute;left:50%;top:72vh;width:80vw;height:16vh;margin:-8vh 0 0 -40vw;mix-blend-mode:screen;background:radial-gradient(ellipse at center,#fff 0%,rgba(255,240,215,.95) 6%,rgba(255,190,120,.45) 20%,rgba(255,140,60,.12) 45%,transparent 70%)}
.fire{position:absolute;left:50%;bottom:var(--bar);width:80vmin;height:62vmin;margin-left:-40vmin;transform-origin:50% 100%;mix-blend-mode:screen;animation:fire .16s steps(2) infinite alternate;
  background:radial-gradient(ellipse at 50% 100%,rgba(255,225,160,.95) 0%,rgba(255,140,40,.55) 18%,rgba(200,60,10,.2) 45%,transparent 70%)}
@keyframes fire{from{opacity:.82;transform:scale(1,1)}to{opacity:1;transform:scale(1.04,1.09)}}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;transition:opacity .8s}
#vignette{position:absolute;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse 75% 70% at 50% 50%,transparent 45%,rgba(0,0,0,.55) 80%,rgba(0,0,0,.9) 100%)}
#grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:7;opacity:.11;mix-blend-mode:overlay}
#bars .bar{position:absolute;left:0;right:0;height:var(--bar);background:#000;z-index:8;transform:scaleY(0);transition:transform 1.6s cubic-bezier(.7,0,.2,1)}
#bars .top{top:0;transform-origin:top}#bars .bot{bottom:0;transform-origin:bottom}
#film.cinema #bars .bar{transform:scaleY(1)}

.layer{position:absolute;inset:0;overflow:hidden}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.portrait .pblur{position:absolute;inset:-8%;background-size:cover;background-position:center;filter:blur(38px) brightness(.32) saturate(.8)}
.portrait .pf{position:absolute;top:var(--bar);bottom:var(--bar);width:42vw;
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 46%,#000 52%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 46%,#000 52%,transparent 100%)}
.portrait .pf.right{right:3vw}.portrait .pf.left{left:3vw}
.portrait .pf img{width:100%;height:100%;object-fit:cover;object-position:center 22%;will-change:transform}
.plabel{position:absolute;top:calc(var(--bar) + 2vh);width:42vw;text-align:center;font-size:1.7vmin;letter-spacing:.35em;color:rgba(233,227,214,.75);text-shadow:0 0 12px #000}
.plabel.right{right:3vw}.plabel.left{left:3vw}

.chapter{position:absolute;top:30vh;width:44vw;z-index:2;text-shadow:0 2px 24px rgba(0,0,0,.9)}
.chapter.left{left:7vw}.chapter.right{right:7vw;text-align:right}
.chapter.center{left:0;right:0;width:auto;text-align:center}
.chapter .cnum{font-family:var(--latin);font-size:2.4vmin;letter-spacing:.6em;color:var(--gold)}
.chapter .cline{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:1.6vmin 0;width:12vmin}
.chapter.right .cline{margin-left:auto;background:linear-gradient(270deg,var(--gold),transparent)}
.chapter.center .cline{margin:1.6vmin auto;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.chapter .cttl{font-size:10vmin;font-weight:900;line-height:1.05;letter-spacing:.08em;
  background:linear-gradient(180deg,#fff8e6 10%,#e8c27a 55%,#9c6a22 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.chapter .cyr{font-family:var(--latin);font-size:3vmin;margin-top:2vmin;letter-spacing:.15em;color:#f3e7cc}
.chapter .cpl{font-size:1.9vmin;margin-top:1vmin;letter-spacing:.3em;color:rgba(233,227,214,.7)}

.sub{position:absolute;left:8vw;right:8vw;bottom:calc(var(--bar) + 2.4vh);text-align:center;z-index:3;text-shadow:0 0 10px #000,0 0 30px #000}
.sub .cn{font-size:2.9vmin;letter-spacing:.12em;color:#f2ede2}
.sub .en{font-family:var(--latin);font-size:1.55vmin;letter-spacing:.18em;color:rgba(233,227,214,.55);margin-top:.9vmin}

.txt{position:absolute;z-index:2;text-shadow:0 2px 30px rgba(0,0,0,.85)}
.center{left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ch{display:inline-block;white-space:pre}
.line{font-size:4.4vmin;letter-spacing:.32em;color:#ddd5c6;font-weight:400}
.gold:has(.ch){background:none!important}
.gold,.gold .ch{background:linear-gradient(180deg,#fffaf0 0%,#f0d08c 45%,#b07a2a 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.big{font-size:8vmin;font-weight:900;letter-spacing:.08em;line-height:1.25}
.huge{font-size:24vmin;font-weight:900;letter-spacing:.12em;line-height:1}
.en2{font-family:var(--latin);font-size:2vmin;letter-spacing:.5em;color:rgba(240,225,190,.8);margin-top:3vmin}
.sweep{background:linear-gradient(110deg,#9c6a22 0%,#e8c27a 35%,#fffbe9 48%,#fffbe9 52%,#e8c27a 65%,#9c6a22 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sweep 5s ease-in-out infinite}
@keyframes sweep{0%{background-position:100% 0}60%,100%{background-position:0 0}}
.flash{position:absolute;inset:0;z-index:20;pointer-events:none}
.year{font-family:var(--latin);font-size:18vmin;font-weight:900;letter-spacing:.06em}

.syl{position:absolute;right:6vw;width:46vw}
.syl .k{font-size:1.8vmin;letter-spacing:.5em;color:var(--gold);margin-bottom:1vmin}
.syl .v{white-space:nowrap;font-size:5vmin;font-weight:700;letter-spacing:.08em}
.syl .v.therefore{font-size:6vmin}
.syl .rule{height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:2vmin}

svg.geo{position:absolute;right:3vw;top:19vh;height:56vh;transition:opacity 1s;width:auto;overflow:visible;filter:drop-shadow(0 0 6px rgba(232,194,122,.7))}
svg.geo .s{fill:none;stroke:#f0d08c;stroke-width:2;stroke-dasharray:1;stroke-dashoffset:1}
svg.geo text{fill:#fff2d0;font-family:var(--latin);font-size:22px;opacity:0}

.vcol{position:absolute;writing-mode:vertical-rl;font-family:var(--brush);color:#efe6d2;text-shadow:0 0 20px rgba(0,0,0,.9),0 0 2px rgba(255,240,210,.4);letter-spacing:.12em}
.seal{position:absolute;width:14vmin;height:14vmin;background:#a3161a;border-radius:1.2vmin;display:flex;align-items:center;justify-content:center;box-shadow:0 0 30px rgba(163,22,26,.6),inset 0 0 1vmin rgba(0,0,0,.4);transform:rotate(-6deg)}
.seal span{writing-mode:vertical-rl;font-family:var(--brush);font-size:5.4vmin;line-height:1.08;color:#f8e9d6;height:11.4vmin;display:block}
.sickles{position:absolute;left:14vw;right:14vw;top:34vh;height:min(34vh,22vw);display:flex;justify-content:space-between;align-items:flex-end}
.sickles svg{height:100%;width:auto;overflow:visible;transition:filter .6s}
.sickles svg.guilty{filter:drop-shadow(0 0 14px #ff2a2a) drop-shadow(0 0 30px rgba(255,40,40,.6))}
canvas.full{position:absolute;inset:0;width:100%;height:100%}

.apple{position:absolute;left:50%;top:0;width:5vmin;height:5vmin;margin-left:-2.5vmin;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a7a,#c0141c 55%,#5a0508);box-shadow:0 0 20px rgba(255,60,60,.5)}
.apple::before{content:"";position:absolute;left:46%;top:-1.4vmin;width:.5vmin;height:1.6vmin;background:#5a3a1a;border-radius:.3vmin;transform:rotate(12deg)}
.earth{position:absolute;left:50%;top:50%;width:14vmin;height:14vmin;margin:-7vmin 0 0 -7vmin;border-radius:50%;background:radial-gradient(circle at 35% 30%,#9fd6ff,#2a6cc4 45%,#0b1f45 80%);box-shadow:0 0 40px rgba(80,160,255,.55)}
.orbit{position:absolute;left:50%;top:50%;width:64vmin;height:64vmin;margin:-32vmin 0 0 -32vmin;border-radius:50%;border:1px dashed rgba(240,208,140,.45)}
.moon{position:absolute;width:3.4vmin;height:3.4vmin;margin:-1.7vmin 0 0 -1.7vmin;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bdb6a8 50%,#4a463e);box-shadow:0 0 18px rgba(255,255,240,.5)}
.eq{font-family:"Times New Roman",var(--serif);font-style:italic;font-size:11vmin;display:flex;align-items:center;gap:2.5vmin}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-size:.72em;line-height:1.1}
.frac span:first-child{border-bottom:.6vmin solid currentColor;padding:0 1.5vmin}

.clue{position:absolute;font-size:3vmin;letter-spacing:.15em;display:flex;align-items:center;gap:1.4vmin;color:#f1ead9}
.clue i{display:inline-block;width:3.6vmin;height:3.6vmin;border:2px solid var(--gold);border-radius:50%;position:relative;box-shadow:0 0 12px rgba(232,194,122,.6)}
.clue i::after{content:"";position:absolute;width:1.6vmin;height:2px;background:var(--gold);right:-1.3vmin;bottom:-.4vmin;transform:rotate(45deg)}
.clue small{display:block;font-family:var(--latin);font-size:1.3vmin;letter-spacing:.2em;color:rgba(233,227,214,.55)}
.typer{white-space:pre-line;font-size:4.2vmin;line-height:1.7;letter-spacing:.1em}
.typer::after{content:"▍";color:var(--gold);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

.scramble{position:absolute;right:6vw;top:30vh;font-family:Consolas,"Courier New",monospace;font-size:3.4vmin;line-height:1.5;letter-spacing:.45em;color:rgba(120,255,200,.55);text-shadow:0 0 8px rgba(80,255,180,.6);white-space:pre}
.scramble b{color:#ffe7a8;text-shadow:0 0 14px rgba(255,210,120,.9);font-weight:700}
.bignum{position:absolute;right:6vw;top:19vh;font-family:var(--latin);font-size:3.6vmin;letter-spacing:.08em;color:#f0d08c;text-shadow:0 0 16px rgba(240,200,120,.6)}

.gel{position:absolute;right:7vw;top:19vh;height:50vh;display:flex;gap:2.2vmin;padding:2vmin;border:1px solid rgba(140,180,255,.25);background:rgba(5,10,30,.55);border-radius:.6vmin}
.gel .lane{position:relative;width:5.4vmin;height:100%;background:rgba(80,120,255,.06);border-radius:.3vmin;transition:box-shadow .5s,background .5s}
.gel .lane.match{box-shadow:0 0 0 2px #ffd27a,0 0 24px rgba(255,210,122,.7);background:rgba(255,210,122,.08)}
.gel .band{position:absolute;left:8%;right:8%;height:.9vmin;border-radius:.4vmin;background:#9fd0ff;box-shadow:0 0 10px rgba(130,190,255,.9)}
.gel .lbl{position:absolute;bottom:-4.2vmin;left:-2vmin;right:-2vmin;text-align:center;font-size:1.5vmin;letter-spacing:.1em;color:rgba(220,230,255,.8)}
.gelttl{position:absolute;right:7vw;top:12.5vh;font-family:var(--latin);font-size:1.9vmin;letter-spacing:.3em;color:#bcd6ff}

.goboard{position:absolute;left:50%;top:50%;width:58vmin;height:58vmin;margin:-29vmin 0 0 -29vmin}
.split{position:absolute;top:0;bottom:0;width:50%;overflow:hidden}
.split img{width:100%;height:100%;object-fit:cover;object-position:center 20%;filter:grayscale(1) contrast(1.15) brightness(.62)}
.split.l{left:0;-webkit-mask-image:linear-gradient(90deg,#000 70%,transparent);mask-image:linear-gradient(90deg,#000 70%,transparent)}
.split.r{right:0;-webkit-mask-image:linear-gradient(270deg,#000 70%,transparent);mask-image:linear-gradient(270deg,#000 70%,transparent)}
.word{position:absolute;font-weight:900;color:#fff;text-shadow:0 0 20px rgba(255,210,140,.8),0 0 60px rgba(0,0,0,.9);white-space:nowrap}
.fog .f{position:absolute;inset:-30%;animation:fogm 24s ease-in-out infinite alternate}
.fog .f1{background:radial-gradient(ellipse 40% 25% at 30% 65%,rgba(170,185,200,.16),transparent 70%),radial-gradient(ellipse 35% 22% at 75% 35%,rgba(170,185,200,.12),transparent 70%)}
.fog .f2{background:radial-gradient(ellipse 45% 30% at 60% 75%,rgba(150,165,185,.14),transparent 70%);animation-duration:31s;animation-direction:alternate-reverse}
@keyframes fogm{from{transform:translateX(-8%)}to{transform:translateX(8%)}}
.montage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.montage .my{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;font-family:var(--latin);font-weight:900;font-size:20vmin;color:#fff;mix-blend-mode:difference;letter-spacing:.05em}
.credits{font-size:1.8vmin;line-height:2.1;letter-spacing:.2em;color:rgba(233,227,214,.75)}
.credits h4{font-family:var(--latin);font-weight:400;letter-spacing:.5em;color:var(--gold);font-size:1.6vmin;margin:2.4vmin 0 .6vmin}

.card .cy{font-family:var(--latin);font-size:13vmin;font-weight:900;line-height:1;background:linear-gradient(180deg,#fff,#9fd8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.card .cn2{font-size:5.4vmin;font-weight:900;margin-top:1.6vmin;letter-spacing:.06em;color:#fff}
.card .cd{font-size:2.2vmin;letter-spacing:.4em;margin-top:1.4vmin;color:rgba(200,230,255,.8)}
.chat{position:absolute;left:24vw;right:24vw;top:17vh;padding:3vmin 3.6vmin;background:rgba(10,14,22,.78);border:1px solid rgba(232,194,122,.28);border-radius:1.4vmin;box-shadow:0 0 60px rgba(90,180,255,.15),inset 0 0 40px rgba(255,255,255,.02);backdrop-filter:blur(10px);font-size:2.5vmin;line-height:1.6;z-index:3}
.chat .hd{font-family:var(--latin);font-size:1.7vmin;letter-spacing:.3em;color:#e8c27a;display:flex;align-items:center;gap:1.2vmin;padding-bottom:1.6vmin;border-bottom:1px solid rgba(232,194,122,.18);margin-bottom:2vmin}
.chat .hd i{width:1.1vmin;height:1.1vmin;border-radius:50%;background:#e8c27a;box-shadow:0 0 10px #e8c27a;animation:blink 1.6s ease-in-out infinite}
.chat .u{text-align:right;margin-bottom:2vmin}
.chat .u span{display:inline-block;min-height:1.6em;background:rgba(232,194,122,.13);border:1px solid rgba(232,194,122,.25);border-radius:1.2vmin 1.2vmin .2vmin 1.2vmin;padding:.6vmin 2vmin;color:#fff}
.chat .u span:empty{border-color:transparent;background:none}
.chat .th{font-size:1.8vmin;letter-spacing:.2em;color:#8fb7d6;height:2.6vmin;opacity:0;transition:opacity .4s}
.chat .th.on{opacity:1}
.chat .th b{animation:blink 1s steps(1) infinite;font-weight:400}.chat .th b:nth-child(2){animation-delay:.33s}.chat .th b:nth-child(3){animation-delay:.66s}
.chat .st{border-left:2px solid rgba(143,183,214,.35);padding-left:1.8vmin;margin:.6vmin 0 .6vmin .4vmin;color:#c9d6e2;min-height:1.6em;opacity:0;transition:opacity .3s}
.chat .st.on{opacity:1}
.chat .st em{font-style:normal;color:#9fd8ff;margin-right:.6vmin}
.chat .cc{margin-top:2vmin;font-size:3vmin;font-weight:700;color:#f0d08c;min-height:1.6em;text-shadow:0 0 18px rgba(240,200,120,.4)}
/* UI */
#ui{position:absolute;left:0;right:0;bottom:0;z-index:30;padding:2.2vh 3vw 2.6vh;background:linear-gradient(transparent,rgba(0,0,0,.85));opacity:0;transition:opacity .4s;font-family:var(--serif)}
#ui.show{opacity:1}
#ui .row{display:flex;align-items:center;gap:16px;color:#ddd;font-size:14px}
#ui button{background:none;border:1px solid rgba(255,255,255,.25);color:#eee;border-radius:999px;height:34px;min-width:34px;padding:0 12px;cursor:pointer;font-size:14px;font-family:inherit}
#ui button:hover{border-color:var(--gold);color:var(--gold)}
#prog{position:relative;height:18px;margin-bottom:10px;cursor:pointer}
#prog .track{position:absolute;left:0;right:0;top:8px;height:3px;background:rgba(255,255,255,.18);border-radius:3px}
#prog .fill{position:absolute;left:0;top:8px;height:3px;background:var(--gold);border-radius:3px;width:0}
#prog .mk{position:absolute;top:4px;width:2px;height:11px;background:rgba(255,255,255,.45)}
#prog .tip{position:absolute;bottom:20px;transform:translateX(-50%);background:rgba(0,0,0,.85);border:1px solid rgba(232,194,122,.4);padding:3px 9px;border-radius:4px;font-size:12px;white-space:nowrap;display:none;color:#eee}
#chapname{color:var(--gold);letter-spacing:.2em;flex:1;text-align:center}
#time{font-variant-numeric:tabular-nums;color:#aaa}

#start{position:absolute;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity 1.2s}
#start.gone{opacity:0;pointer-events:none}
#start .t1{font-size:15vmin;font-weight:900;letter-spacing:.3em;margin-right:-.3em}
#start .t2{font-family:var(--latin);letter-spacing:.6em;font-size:2vmin;color:rgba(232,194,122,.85);margin-top:2vmin}
#start .t3{margin-top:5vmin;font-size:1.8vmin;letter-spacing:.3em;color:#888}
#go{margin-top:5vmin;background:none;border:1px solid rgba(232,194,122,.6);color:var(--gold);font-family:var(--serif);font-size:2.2vmin;letter-spacing:.5em;padding:1.8vmin 4vmin 1.8vmin 4.5vmin;border-radius:999px;cursor:pointer;transition:all .3s}
#go:hover:not(:disabled){background:rgba(232,194,122,.12);box-shadow:0 0 30px rgba(232,194,122,.3)}
#go:disabled{opacity:.4;cursor:wait}
#load{width:30vmin;height:2px;background:#222;margin-top:3vmin;position:relative;overflow:hidden}
#load i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);width:0;transition:width .2s}
</style>
</head>
<body>

<script>
/* =========================================================
   基础工具
   ========================================================= */
const $=s=>document.querySelector(s);
const stage=$('#stage'), film=$('#film');
const rand=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=k=>1-Math.pow(1-k,3);
const easeIn=k=>k*k*k;

/* =========================================================
   声音：全部由 Web Audio 实时合成
   ========================================================= */
let AC=null, master, wetIn, musicBus, NOISE, muted=false;
function N(n){if(typeof n==='number')return n;const m=n.match(/^([A-G])(#|b)?(-?\d)$/);const b={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]=='#'?1:m[2]=='b'?-1:0);return 440*Math.pow(2,((+m[3]+1)*12+b-69)/12);}
function audioInit(){
  if(AC) return;
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor();
  comp.threshold.value=-18;comp.knee.value=12;comp.ratio.value=5;comp.attack.value=.004;comp.release.value=.3;
  master=AC.createGain();master.gain.value=.9;master.connect(comp);comp.connect(AC.destination);
  const conv=AC.createConvolver();conv.buffer=makeIR(5,2.6);
  wetIn=AC.createGain();wetIn.gain.value=.55;wetIn.connect(conv);conv.connect(master);
  musicBus=AC.createGain();musicBus.gain.value=1.7;musicBus.connect(master);
  NOISE=AC.createBuffer(1,AC.sampleRate*3,AC.sampleRate);
  const d=NOISE.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  setInterval(runLoops,25);
}
function makeIR(sec,dec){const len=AC.sampleRate*sec,b=AC.createBuffer(2,len,AC.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec);}return b;}
function route(node,dry=1,wet=.3){const a=AC.createGain();a.gain.value=dry;node.connect(a);a.connect(master);if(wet>0){const b=AC.createGain();b.gain.value=wet;node.connect(b);b.connect(wetIn);}}
function mroute(node,dry=1,wet=.3){const a=AC.createGain();a.gain.value=dry;node.connect(a);a.connect(musicBus);if(wet>0){const b=AC.createGain();b.gain.value=wet*1.5;node.connect(b);b.connect(wetIn);}}
function noise(t,dur){const s=AC.createBufferSource();s.buffer=NOISE;s.loop=true;s.start(t,Math.random()*2);s.stop(t+dur+.05);return s;}
function gainEnv(t,a,peak,d){const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(peak,.0002),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);return g;}
function filt(type,f,q=1){const x=AC.createBiquadFilter();x.type=type;x.frequency.value=f;x.Q.value=q;return x;}
function osc(type,f,t,dur){const o=AC.createOscillator();o.type=type;o.frequency.value=f;o.start(t);o.stop(t+dur);return o;}
const NOW=()=>AC.currentTime;

const sfx={
  boom(v=1,t=NOW()){if(!AC)return;
    const o=osc('sine',120,t,2.6);o.frequency.setValueAtTime(130,t);o.frequency.exponentialRampToValueAtTime(26,t+1.8);
    const g=gainEnv(t,.008,.95*v,2.3);o.connect(g);route(g,1,.25);
    const n=noise(t,1.6),f=filt('lowpass',1400);f.frequency.setValueAtTime(1600,t);f.frequency.exponentialRampToValueAtTime(70,t+1.3);
    const g2=gainEnv(t,.004,.7*v,1.4);n.connect(f);f.connect(g2);route(g2,1,.7);},
  braam(v=1,root='D1',t=NOW()){if(!AC)return;
    const f=filt('lowpass',120,2.2);f.frequency.setValueAtTime(110,t);f.frequency.exponentialRampToValueAtTime(1700,t+.16);f.frequency.exponentialRampToValueAtTime(240,t+4);
    const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.3*v,t+.04);g.gain.setValueAtTime(.3*v,t+.7);g.gain.exponentialRampToValueAtTime(.0001,t+5.8);
    f.connect(g);route(g,1,.85);const r=N(root);
    [1,2,3,4,4.8].forEach(m=>[-11,0,11].forEach(dt=>{const o=osc('sawtooth',r*m,t,6);o.detune.value=dt+rand(-4,4);o.connect(f);}));
    this.boom(v*.85,t);},
  hit(v=1,t=NOW()){if(!AC)return;
    const o=osc('sine',95,t,.9);o.frequency.exponentialRampToValueAtTime(38,t+.6);const g=gainEnv(t,.005,.7*v,.8);o.connect(g);route(g,1,.3);
    const n=noise(t,.4),f=filt('lowpass',2200),g2=gainEnv(t,.002,.45*v,.35);n.connect(f);f.connect(g2);route(g2,1,.6);},
  riser(d=3,v=1,t=NOW()){if(!AC)return;
    const n=noise(t,d),f=filt('bandpass',200,4);f.frequency.setValueAtTime(200,t);f.frequency.exponentialRampToValueAtTime(7500,t+d);
    const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.55*v,t+d);g.gain.linearRampToValueAtTime(0,t+d+.06);n.connect(f);f.connect(g);route(g,1,.45);
    const o=osc('sawtooth',55,t,d+.1);o.frequency.exponentialRampToValueAtTime(440,t+d);const f2=filt('lowpass',900),g2=AC.createGain();
    g2.gain.setValueAtTime(.0001,t);g2.gain.exponentialRampToValueAtTime(.14*v,t+d);g2.gain.linearRampToValueAtTime(0,t+d+.05);o.connect(f2);f2.connect(g2);route(g2,1,.3);},
  whoosh(v=.5,d=1,t=NOW()){if(!AC)return;
    const n=noise(t,d),f=filt('bandpass',300,1.5);f.frequency.setValueAtTime(250,t);f.frequency.exponentialRampToValueAtTime(2600,t+d*.5);f.frequency.exponentialRampToValueAtTime(300,t+d);
    const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5*v,t+d*.5);g.gain.exponentialRampToValueAtTime(.0001,t+d);n.connect(f);f.connect(g);route(g,1,.5);},
  tick(t=NOW(),hi=true,v=.25){if(!AC)return;
    const n=noise(t,.04),f=filt(hi?'highpass':'bandpass',hi?3800:1800,hi?.7:3),g=gainEnv(t,.001,v,.035);n.connect(f);f.connect(g);route(g,1,.15);},
  heart(t=NOW(),v=.8){if(!AC)return;[0,.28].forEach((dt,i)=>{const o=osc('sine',62,t+dt,.4);o.frequency.exponentialRampToValueAtTime(36,t+dt+.25);const g=gainEnv(t+dt,.01,v*(i?.65:1),.3);o.connect(g);route(g,1,.1);});},
  type(){if(!AC)return;const t=NOW();const n=noise(t,.03),f=filt('bandpass',rand(2200,3600),1.2),g=gainEnv(t,.001,rand(.12,.22),.03);n.connect(f);f.connect(g);route(g,1,.05);},
  chime(f=1760,v=.15,t=NOW()){if(!AC)return;[1,2.01,3.02].forEach((m,i)=>{const o=osc('sine',f*m,t,4);const g=gainEnv(t,.005,v/(i+1),3.5);o.connect(g);route(g,.6,1);});},
  note(t,f,dur,type='triangle',v=.04,cut=2000){if(!AC)return;const o=osc(type,f,t,dur+.05),fl=filt('lowpass',cut),g=gainEnv(t,.006,v,dur);o.connect(fl);fl.connect(g);mroute(g,.7,.5);},
  pluck(t,f,v=.15){if(!AC)return;const o=osc('triangle',f,t,1.8),o2=osc('sine',f*2,t,1),fl=filt('lowpass',3200),g=gainEnv(t,.003,v,1.6),g2=gainEnv(t,.002,v*.4,.5);o.connect(fl);o2.connect(g2);g2.connect(fl);fl.connect(g);mroute(g,.8,.6);},
  drum(t=NOW(),v=.6){if(!AC)return;const o=osc('sine',110,t,.6);o.frequency.exponentialRampToValueAtTime(45,t+.4);const g=gainEnv(t,.004,v,.5);o.connect(g);route(g,1,.35);
    const n=noise(t,.08),f=filt('lowpass',900),g2=gainEnv(t,.002,v*.35,.07);n.connect(f);f.connect(g2);route(g2,1,.2);},
  stamp(){if(!AC)return;this.hit(1);const t=NOW();const o=osc('square',180,t,.08),f=filt('lowpass',600),g=gainEnv(t,.002,.25,.07);o.connect(f);f.connect(g);route(g,1,.3);},
  glitch(){if(!AC)return;const t=NOW();for(let i=0;i<7;i++){const o=osc('square',rand(80,1800),t+i*.035,.03),g=gainEnv(t+i*.035,.002,.08,.025);o.connect(g);route(g,1,.1);}},
  beep(f=1900,v=.05){if(!AC)return;const t=NOW();const o=osc('square',f,t,.08),g=gainEnv(t,.002,v,.06);o.connect(g);route(g,.8,.2);},
  stone(){if(!AC)return;const t=NOW();const n=noise(t,.05),f=filt('bandpass',rand(1500,2200),6),g=gainEnv(t,.001,.5,.06);n.connect(f);f.connect(g);route(g,1,.3);},
  shutter(v=.4){if(!AC)return;const t=NOW();const n=noise(t,.05),f=filt('highpass',2500),g=gainEnv(t,.001,v,.04);n.connect(f);f.connect(g);route(g,1,.1);
    const o=osc('sine',70,t,.15),g2=gainEnv(t,.003,v*.9,.12);o.connect(g2);route(g2,1,0);},
  buzz(d=4){if(!AC)return;const t=NOW();const o=osc('sawtooth',210,t,d),o2=osc('sawtooth',223,t,d),f=filt('bandpass',700,2),g=AC.createGain();
    const lfo=osc('sine',27,t,d),lg=AC.createGain();lg.gain.value=60;lfo.connect(lg);lg.connect(o.frequency);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+1);g.gain.setValueAtTime(.05,t+d-1);g.gain.linearRampToValueAtTime(0,t+d);
    o.connect(f);o2.connect(f);f.connect(g);route(g,1,.2);}
};

/* =========================================================
   配乐引擎：史诗管弦（弦乐固定音型 · 合唱 · 铜管 · 太鼓），全部实时合成
   ========================================================= */
let low=null, choir=null, loops=[], curMood=null, scoreBpm=90;
function fadeVoice(v,t){if(!v)return;v.g.gain.cancelScheduledValues(t);v.g.gain.setValueAtTime(v.g.gain.value,t);v.g.gain.linearRampToValueAtTime(0,t+2);v.nodes.forEach(n=>{try{n.stop(t+2.1)}catch(e){}});}
function setLow(note,vol=.1,t=NOW()){fadeVoice(low,t);low=null;if(!note)return;
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+1.5);const f=filt('lowpass',420,.8),nodes=[];
  [[N(note),-8,'sawtooth'],[N(note),8,'sawtooth'],[N(note)/2,0,'sine']].forEach(([fr,dt,ty])=>{const o=osc(ty,fr,t,1e5);o.detune.value=dt;o.connect(ty=='sine'?g:f);nodes.push(o);});
  f.connect(g);mroute(g,.8,.5);low={g,nodes};}
function setChoir(notes,vol=.06,t=NOW()){fadeVoice(choir,t);choir=null;if(!notes||!vol)return;
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+1.8);const mix=AC.createGain(),nodes=[];
  [[730,9,1],[1090,10,.5],[2440,12,.22]].forEach(([fr,q,a])=>{const bp=filt('bandpass',fr,q),ga=AC.createGain();ga.gain.value=a*3;mix.connect(bp);bp.connect(ga);ga.connect(g);});
  const vib=osc('sine',5.2,t,1e5),vg=AC.createGain();vg.gain.value=6;vib.connect(vg);nodes.push(vib);
  notes.forEach(n=>[-12,0,11].forEach(dt=>{const o=osc('sawtooth',N(n),t,1e5);o.detune.value=dt+rand(-3,3);vg.connect(o.detune);o.connect(mix);nodes.push(o);}));
  mroute(g,.5,1);choir={g,nodes};}
let strs=null;
function setStrings(notes,vol=.05,t=NOW()){fadeVoice(strs,t);strs=null;if(!notes||!vol)return;
  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+1.2);const f=filt('lowpass',2100,.6),nodes=[];
  const vib=osc('sine',4.8,t,1e5),vg=AC.createGain();vg.gain.value=7;vib.connect(vg);nodes.push(vib);
  notes.forEach(n=>[-14,-4,6,15].forEach(dt=>{const o=osc('sawtooth',N(n),t,1e5);o.detune.value=dt;vg.connect(o.detune);const og=AC.createGain();og.gain.value=1/notes.length;o.connect(og);og.connect(f);nodes.push(o);}));
  f.connect(g);mroute(g,.75,.8);strs={g,nodes};}
const ins={
  str(t,f,d=.18,v=.03,cut=2400){const fl=filt('lowpass',cut,.7),g=gainEnv(t,.008,v,d);[-9,9].forEach(dt=>{const o=osc('sawtooth',f,t,d+.1);o.detune.value=dt;o.connect(fl);});fl.connect(g);mroute(g,.8,.45);},
  brass(t,notes,d=1.6,v=.06){const fl=filt('lowpass',300,1.5);fl.frequency.setValueAtTime(300,t);fl.frequency.exponentialRampToValueAtTime(2600,t+.22);fl.frequency.exponentialRampToValueAtTime(900,t+d);
    const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.1);g.gain.setValueAtTime(v,t+d*.6);g.gain.exponentialRampToValueAtTime(.0001,t+d);fl.connect(g);mroute(g,.8,.7);
    notes.forEach(n=>[-7,0,7].forEach(dt=>{const o=osc('sawtooth',N(n),t,d+.05);o.detune.value=dt;o.connect(fl);}));},
  taiko(t,v=.8){const o=osc('sine',150,t,.9);o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(46,t+.35);const g=gainEnv(t,.004,v,.75);o.connect(g);mroute(g,1,.55);
    const n=noise(t,.25),f=filt('lowpass',700),g2=gainEnv(t,.002,v*.55,.22);n.connect(f);f.connect(g2);mroute(g2,1,.6);},
  snare(t,v=.2){const n=noise(t,.2),f=filt('bandpass',1900,.9),g=gainEnv(t,.002,v,.16);n.connect(f);f.connect(g);mroute(g,1,.5);},
  piano(t,f,v=.07){[[1,1],[2,.35],[3,.12]].forEach(([m,a])=>{const o=osc(m==3?'triangle':'sine',f*m,t,3);const g=gainEnv(t,.004,v*a,2.6/m);o.connect(g);mroute(g,.7,.6);});},
  timp(t,dur,v=.6){for(let x=0;x<dur;x+=.07)ins.taiko(t+x,v*(.2+.8*x/dur)*.6);}
};
/* 主题旋律：贯穿全片的"推理动机"，小调开篇，大调终章 */
function theme(mode='minor',root='D4'){if(!AC)return;const t=NOW()+.05,b=60/scoreBpm,r=N(root);
  const iv=mode==='minor'?[[0,1],[7,1.5],[5,.5],[3,.5],[2,.5],[3,1],[0,2.5]]:[[0,1],[7,1.5],[9,.5],[7,.5],[4,.5],[7,1],[12,2.5]];
  let x=0;iv.forEach(([sm,d])=>{const f=r*Math.pow(2,sm/12);ins.brass(t+x*b,[f,f/2,f*2],d*b+.3,.075);x+=d;});}
function addLoop(int,fn,delay=.05){loops.push({int,fn,next:NOW()+delay,i:0});}
function runLoops(){if(!AC||AC.state!=='running')return;const now=NOW();loops.forEach(L=>{while(L.next<now+.12){try{L.fn(L.next,L.i);}catch(e){console.error(e);}L.i++;L.next+=L.int;}});}
function score(c){
  scoreBpm=c.bpm;const st=60/c.bpm/4,spc=16*(c.bars||1);
  addLoop(st,(t,i)=>{
    const ci=Math.floor(i/spc)%c.prog.length,ch=c.prog[ci],tones=ch.slice(1),s=i%16;
    if(i%spc===0){setLow(ch[0],(c.low??.09)*1.25,t);setChoir(c.choir?tones.map(n=>N(n)*2):null,c.choir*1.3,t);setStrings(c.str===0?null:[N(tones[0]),...tones.map(n=>N(n)*2)],c.str??.055,t);if(c.brass&&i>0)ins.brass(t,tones,st*spc*.9,c.brass);}
    const pick=(pat,oct)=>{const k=pat[s%pat.length];return k<0?0:N(tones[k%tones.length])*Math.pow(2,oct+Math.floor(k/tones.length));};
    if(c.ost){const f=pick(c.ost,c.ostOct??1);if(f)ins.str(t,f,st*1.3,(c.ostV??.03)*1.35,c.ostCut??2400);}
    if(c.taiko){const p=c.taiko[s];if(p==='X')ins.taiko(t,c.taikoV??.8);else if(p==='x')ins.taiko(t,(c.taikoV??.8)*.5);}
    if(c.snare&&c.snare[s]==='x')ins.snare(t,c.snareV??.18);
    if(c.piano){const f=pick(c.piano,c.pianoOct??1);if(f)ins.piano(t,f,c.pianoV??.06);}
    if(c.pluck){const k=c.pluck[s%c.pluck.length];if(k>=0)sfx.pluck(t,N(c.scale[(k+ci*2)%c.scale.length]),c.pluckV??.14);}
    if(c.tick&&s%c.tick===0)sfx.tick(t,(s/c.tick)%2===0,.17);
    if(c.heart&&s===0&&(i/16)%c.heart===0)sfx.heart(t,.5);
  });
}
const DM=['D2','D3','F3','A3'],BB=['Bb1','D3','F3','Bb3'],FM=['F2','F3','A3','C4'],CM=['C2','C3','E3','G3'],GM=['G1','G3','Bb3','D4'],AM=['A1','A3','C4','E4'],
  AMAJ=['A1','A3','C#4','E4'],DMAJ=['D2','D3','F#3','A3'],BM=['B1','B2','D3','F#3'],GMAJ=['G1','G2','B2','D3'],EB=['Eb2','Eb3','G3','Bb3'],AB=['Ab1','Ab3','C4','Eb4'],CMIN=['C2','C3','Eb3','G3'],EMAJ=['E2','E3','G#3','B3'],GMJ=['G1','G3','B3','D4'];
const MOODS={

  cosmos(){score({bpm:60,bars:2,prog:[DM,BB,GM,AMAJ],low:.11,choir:.08,str:.06,taiko:'X...............',taikoV:.55});},

  ancient(){score({bpm:84,bars:2,prog:[['D2','D3','A3','D4'],['C2','C3','G3','C4']],low:.1,choir:.06,ost:[0,-1,-1,1,-1,-1,2,-1],ostOct:0,ostV:.03,ostCut:1400,taiko:'X..x..X.x..x.X..',taikoV:.7});},

function drawFx(dt){

  case'stars':{const cx=W/2,cy=H/2,s=Math.max(W,H)*.5;parts.forEach((p,i)=>{const pz=p.z;p.z-=dt*.32;if(p.z<=.02){parts[i]=spawn('stars');return;}
    const x1=cx+p.x/pz*s,y1=cy+p.y/pz*s,x2=cx+p.x/p.z*s,y2=cy+p.y/p.z*s,a=clamp(1-p.z,0,1);
    fc.strokeStyle=`rgba(200,220,255,${a})`;fc.lineWidth=a*2.2;fc.beginPath();fc.moveTo(x1,y1);fc.lineTo(x2,y2);fc.stroke();});}break;
  case'network':parts.forEach(p=>{p.x+=p.vx*k;p.y+=p.vy*k;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;});
    for(let i=0;i<parts.length;i++){const a=parts[i];for(let j=i+1;j<parts.length;j++){const b=parts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<160){fc.strokeStyle=`rgba(90,200,255,${(1-d/160)*.35})`;fc.lineWidth=1;fc.beginPath();fc.moveTo(a.x,a.y);fc.lineTo(b.x,b.y);fc.stroke();}}
      fc.fillStyle='rgba(150,230,255,.9)';fc.beginPath();fc.arc(a.x,a.y,1.8+Math.sin(fxT*2+i)*.6,0,7);fc.fill();}break;
  case'rain':fc.strokeStyle='rgba(170,190,215,.22)';fc.lineWidth=1;fc.beginPath();parts.forEach((p,i)=>{p.y+=p.v*k;p.x+=p.v*.18*k;if(p.y>H+30)parts[i]=spawn('rain');fc.moveTo(p.x,p.y);fc.lineTo(p.x-p.l*.18,p.y-p.l);});fc.stroke();break;
  case'binary':fc.font='14px Consolas,monospace';cols.forEach(c=>{if(!c.on)return;c.y+=c.v*k;if(c.y>H+300){c.y=rand(-400,-50);c.on=Math.random()<.5;}
    for(let j=0;j<16;j++){const y=c.y-j*17;if(y<-20||y>H+20)continue;fc.fillStyle=j==0?'rgba(220,255,240,.75)':`rgba(70,255,190,${(1-j/16)*.32})`;fc.fillText(((c.x*7+j*13+((fxT*8)|0))%5<2)?'1':'0',c.x,y);}});break;

    const gr=fc.createLinearGradient(x-len*c.dir,y+H*.025,x,y);gr.addColorStop(0,`rgba(${c.c},0)`);gr.addColorStop(1,`rgba(${c.c},.95)`);
    fc.strokeStyle=gr;fc.lineWidth=3;fc.beginPath();fc.moveTo(x-len*c.dir,y+H*.025);fc.lineTo(x,y);fc.stroke();
    const rg=fc.createRadialGradient(x,y,0,x,y,46);rg.addColorStop(0,'rgba(255,252,240,1)');rg.addColorStop(.2,`rgba(${c.c},.65)`);rg.addColorStop(1,`rgba(${c.c},0)`);fc.fillStyle=rg;fc.beginPath();fc.arc(x,y,46,0,7);fc.fill();
    for(let j=1;j<6;j++){const sx=x-c.dir*j*len*.14+Math.sin(fxT*30+j)*6,sy=y+j*H*.004+Math.cos(fxT*27+j)*6;fc.fillStyle=`rgba(${c.c},${.7-j*.12})`;fc.beginPath();fc.arc(sx,sy,2.2,0,7);fc.fill();}
    return true;});
  fc.globalCompositeOperation='source-over';
}

let SCENES=[], starts=[], TOTAL=0;
let playing=false, movieT=0, wallRef=0, cur=-1, curDur=0, cues=[], cueI=0, frameFns=[];
const now=()=>playing?(performance.now()-wallRef)/1000:movieT;
let curST=0;
const sceneTime=()=>curST;
function at(t,fn){cues.push({t,fn});}
function onFrame(fn){frameFns.push(fn);}
function sceneAt(t){for(let i=SCENES.length-1;i>=0;i--)if(t>=starts[i])return i;return 0;}
function clearStage(){stage.getAnimations({subtree:false}).forEach(a=>a.cancel());stage.innerHTML='';frameFns=[];}
function enterScene(i){
  cur=i;curDur=SCENES[i].dur;curST=Math.max(0,now()-starts[i]);clearStage();for(const k in slots)delete slots[k];cues=[];cueI=0;
  SCENES[i].build();cues.sort((a,b)=>a.t-b.t);if(i>0)flash('#000',900);
  const cam=$('#cam');cam.getAnimations().forEach(a=>a.cancel());cam.animate([{transform:'scale(1)'},{transform:'scale(1.045)'}],{duration:curDur*1000,fill:'both',easing:'linear'});
  $('#chapname').textContent=SCENES[i].name;
}
function play(){if(playing)return;wallRef=performance.now()-movieT*1000;playing=true;document.getAnimations().forEach(a=>{if(a.playState==='paused')a.play();});if(AC)AC.resume();$('#bplay').textContent='❚❚';}
function pause(){if(!playing)return;movieT=now();playing=false;document.getAnimations().forEach(a=>{if(a.playState==='running')a.pause();});if(AC)AC.suspend();$('#bplay').textContent='▶';showUI();}
function seekScene(i){i=clamp(i,0,SCENES.length-1);movieT=starts[i];cur=-1;const was=playing;playing=false;play();}
let lastF=performance.now(),gFlip=0;
function tick(){
  requestAnimationFrame(tick);
  const tn=performance.now(),dt=Math.min(.1,(tn-lastF)/1000);lastF=tn;
  if(playing){
    const t=now();
    if(t>=TOTAL){endFilm();return;}
    const si=sceneAt(t);if(si!==cur)enterScene(si);
    const st=t-starts[cur];curST=st;
    for(let ci=0;ci<cues.length;ci++){const c=cues[ci];if(!c.done&&c.t<=st){c.done=true;try{c.fn();}catch(e){console.error(e);}}}
    frameFns.forEach(f=>{try{f(st);}catch(e){console.error(e);}});
    drawFx(dt);
  }
  if((gFlip++&1)==0)drawGrain();
  updUI();
}

const slots={};

}
